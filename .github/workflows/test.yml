name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the suite only reads the checkout. Nothing here pushes,
# comments, or publishes.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (mutable tags can be moved). The
# trailing comment is the tag the SHA was resolved from; Dependabot
# (.github/dependabot.yml) proposes bumps weekly.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.11 is the compatibility floor declared in SKILL.md (3.9/3.10 are EOL);
        # 3.13 is current. scripts/of.py refuses anything below the floor.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (kernel + packaging + README quickstart from a fresh temp dir)
        run: python3 -m unittest discover -s tests -v
      - name: Recovery evals (of eval --strict --kernel)
        env:
          OF_NO_UPDATE_CHECK: "1"
        run: python3 scripts/of.py eval --strict --kernel
      - name: Skill structure + version sync
        run: bash scripts/validate-skill.sh

  unused-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Unused import / F401 (stdlib; no pip)
        run: python3 scripts/check_unused_imports.py --self-test && python3 scripts/check_unused_imports.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # contents: read cannot post PR comments; say so instead of failing the write
          GITLEAKS_ENABLE_COMMENTS: "false"
