name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is the compatibility floor declared in SKILL.md; 3.13 is current.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (kernel + packaging)
        run: python3 -m unittest discover -s tests -v
      - name: Recovery evals (of eval --strict --kernel)
        env:
          OF_NO_UPDATE_CHECK: "1"
        run: python3 scripts/of.py eval --strict --kernel
      - name: Skill structure + version sync
        run: bash scripts/validate-skill.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
